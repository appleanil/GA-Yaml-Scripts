name: Repo Level Variables

on:
  workflow_dispatch:

jobs:
  repo-level-vars:
    runs-on: ubuntu-latest

    steps:
      - name: Display Repository Secret
        run: |
          echo "Employee Name is: ${{ secrets.NAME }}"

  repo-level-variables:
    runs-on: ubuntu-latest

    steps:
      - name: Display Repository Variables
        run: |
          echo "Employee Company is: ${{ vars.COMPANY }}"
          echo "Employee Role is: ${{ vars.ROLE }}"
