name: Repo Level Vars

on:
  workflow_dispatch:

jobs:
  Repo-Level-Vars:
    runs-on: ubuntu-latest

    steps:
      - name: Display Repository Variables
        run: |
          echo "Name: ${{ vars.NAME }}"
          echo "Company: ${{ vars.COMPANY }}"
          echo "Role: ${{ vars.ROLE }}"

      - name: Display Repository Secrets
        run: |
          echo "Secret 1: ${{ secrets.SEC }}"
          echo "Secret 2: ${{ secrets.CRETS }}"
