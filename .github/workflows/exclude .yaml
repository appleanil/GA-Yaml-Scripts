name: Exclude Matrix Stragety

on: workflow_dispatch

jobs:
  Exclude:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        os: [us-east-1, us-west-2]
        version: [11, 18]
        
        exclude:
          - os: us-east-1
            version: 18
    steps:
      - name: Exclude matrix
        run: |
          echo "AWS region: ${{ matrix.os }}"
          echo "AWS version: ${{ matrix.version }}"
