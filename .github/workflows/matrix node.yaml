name: Matrix with version

on: workflow_dispatch

jobs:
  Matrix-Node:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [16, 18]

    steps:
      - name: Matrix OS and Node
        run: |
          echo "Running OS on: ${{ matrix.os }}"
          echo "Running Node on: ${{ matrix.node }}"
