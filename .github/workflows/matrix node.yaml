name: Matrix OS and Node

on: workflow_dispatch

jobs:
  Matrix-OS-Node:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [17, 18]

    steps:
      - name: Display the OS and Node
        run: |
          echo "Running in ${{ matrix.os }}"
          echo "Node Version is ${{ matrix.node }}"
