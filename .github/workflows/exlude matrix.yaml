name: Exclude Matrix OS and Node

on: workflow_dispatch

jobs:
  Exclude-Matrix:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [16, 18]
        exclude:
          - os: ubuntu-latest
            node: 16
            message: Message is ubuntu-latest, 16 is removed

    steps:
      - name: Matrix with exclude
        run: |
          echo "Running on: ${{ matrix.os }}"
          echo "version is: ${{ matrix.node }}"
          echo "Message is: ${{ matrix.message }}"
