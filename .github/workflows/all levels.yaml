name: Showing Workflow, Job and Step Level Variables

on:
  workflow_dispatch:

env:
  CITY: Adoni
  COUNTRY: NewZealand

jobs:
  step-level-1:
    runs-on: ubuntu-latest

    env:
      CITY: Noida
      BRAND: India

    steps:
      - name: Checking for step level vars
        env:
          COMPANY: Anil Tech
          LOCATION: Australia
        run: |
          echo "Job Level: $BRAND and $CITY"
          echo "Step Level: Company=$COMPANY Location=$LOCATION"

  job-level-2:
    runs-on: ubuntu-latest
    needs: step-level-1

    steps:
      - name: Checking workflow vars
        run: |
          echo "Workflow Level CITY=$CITY"
          echo "Workflow Level COUNTRY=$COUNTRY"

  workflow-level-3:
    runs-on: ubuntu-latest
    needs: job-level-2

    steps:
      - name: Checking workflow vars again
        run: |
          echo "Hi I'm Dhage Anil Kumar"
          echo "CITY=$CITY"
          echo "COUNTRY=$COUNTRY"
