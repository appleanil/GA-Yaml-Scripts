name: Upload and Download Artifact

on: workflow_dispatch

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Enter the data
        run: echo "Hii Im Dhage Anil Kumar and Im learning Devops with Github Actions" > anil.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: datafile
          path: anil.txt

  download-artifact:
    runs-on: ubuntu-latest
    needs: upload-artifact
    steps:
      - name: Downloading the artifact
        uses: actions/download-artifact@v4
        with:
          name: datafile
      - name: Show the data
        run: cat anil.txt
            
