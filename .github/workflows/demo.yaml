name: Variables, Concurrency, Multi Jobs

on:
  workflow_dispatch:

concurrency:
  group: main-branch-group
  cancel-in-progress: true

env:
  BRAND: Workflow-Level
  COMPANY: Amul-Workflow-Level

jobs:

  Simple-job:
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: |
          echo "Hi I'm Dhage Anil Kumar and I'm learning DevOps with GitHub Actions" > anil.txt
          cat anil.txt

  Step-Level-Variables:
    runs-on: ubuntu-latest
    needs: Simple-job

    steps:
      - name: Variables
        env:
          CITY: Adoni
          COUNTRY: India
        run: |
          echo "My name is Dhage Anil Kumar"
          echo "Current address: $CITY"
          echo "Country: $COUNTRY"

  Job-Level-Variables:
    runs-on: ubuntu-latest
    needs: Step-Level-Variables

    env:
      VARIABLE: Dhage Anil Kumar Variables
      NAME: DHAGE ANIL KUMAR

    steps:
      - name: Job Level Variables
        run: |
          echo "Job variable: $VARIABLE"
          echo "My Name: $NAME"

      - name: Second Job Level
        run: |
          echo "Second check: $VARIABLE"
          echo "Name: $NAME"

  Workflow-Level-Variables:
    runs-on: ubuntu-latest
    needs: Job-Level-Variables

    steps:
      - name: Workflow Level
        run: |
          echo "Brand: $BRAND"
          echo "Company: $COMPANY"

  Upload-Artifact:
    runs-on: ubuntu-latest
    needs: Workflow-Level-Variables

    steps:
      - name: Create Artifact
        run: echo "This is an artifact file" > artifact.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact.txt

  Download-Artifact:
    runs-on: ubuntu-latest
    needs: Upload-Artifact

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Show File
        run: cat artifact.txt

  Repo-Level-Variables:
    runs-on: ubuntu-latest
    needs: Download-Artifact
    timeout-minutes: 10

    steps:
      - name: Repository Variables
        run: |
          echo "Variable ANIL: ${{ vars.ANIL }}"
          echo "Variable KUMAR: ${{ vars.KUMAR }}"

      - name: Repository Secrets
        run: |
          echo "Secret FILE: ${{ secrets.FILE }}"
          echo "Secret TEXT: ${{ secrets.TEXT }}"
