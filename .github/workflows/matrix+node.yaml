name: Matrix and Node Version

on: workflow_dispatch

jobs:
  Matrix-Node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [16 ,18]
        env: [dev, prod]
        users: [Anil, Kumar]

    steps:
      - name: Print OS
        run: |
          echo "Running OS: ${{ matrix.os }} Node Version: ${{ matrix.node }} Running in which Env: ${{ matrix.env }} UsersName is: ${{ matrix.users }}"
