name: Three stages in jobs

on: workflow_dispatch

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Build a artifact
        run: echo "building a artifact..."

  test-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: Testing the artifact
        run: echo "testing the artifact..."

  deploy-job:
    runs-on: ubuntu-latest
    needs: test-job
    steps:
      - name: Deploying the artifact
        run: echo "deploying the artifact..."
   
      
        
