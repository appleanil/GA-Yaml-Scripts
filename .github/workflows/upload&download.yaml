name: Upload and Download Artifact

on: workflow_dispatch

jobs:
  Upload-Artifact:
    runs-on: ubuntu-latest

    steps:
      - name: This is the Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: datafile
          path: Github-Actions-practice.txt

  Download-Artifact:
    runs-on: ubuntu-latest
    needs: Upload-Artifact

    steps:
      - name: This is the Download the Artifact
        uses: actions/download-artifact@v4
        with:
          name: datafile

      - name: Show the Artifact
        run: cat Github-Actions-practice.txt
          
