name: Java Set-up Matrix

on: workflow_dispatch

jobs:
  Java-Set-up-Matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: [11, 17]
        os: [ubuntu-latest, windows-latest]
        env: [dev, prod]

    steps:
      - name: Setup java Matrix
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Print all Setup java
        run: |
          echo "Java-Version: ${{ matrix.java }}"
          echo "Java-OS: ${{ matrix.os }}"
          echo "Java-env: ${{ matrix.env }}"
