name: Simple Secrets and Variables in repo-level

on: 
  workflow_dispatch:

jobs:
  sec-vars-repo-level:
    runs-on: ubuntu-latest

    steps:
      - name: Showing the Secrets
        run: | 
          echo "My name is ${{ secrets.NAME }} and password is ${{ secrets.PASSWORD }}" > anil.txt
          echo "my name is ${{ secrets.NAME }} and password is ${{ secrets.PASSWORD}}".

      - name: Showing the variables
        run: |
          echo "My name is ${ vars.NAME }} and My role is ${{ vars.ROLE }}" > kumar.txt
          echo "My name is ${{ vars.NAME }} and My role is ${{ vars.ROLE }}".
